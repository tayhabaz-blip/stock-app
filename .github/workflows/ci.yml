name: CI

on:
  push:
    # gh-pages נכלל בכוונה: עד היום הפרונטאנד נפרס בלי שום בדיקה אוטומטית,
    # וכל אימות נעשה בעיניים מול צילום מסך.
    branches: [ main, gh-pages ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # בדיקות השרת רצות על קוד השרת בלבד
    if: github.ref != 'refs/heads/gh-pages'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi==0.141.1 \
            "uvicorn[standard]==0.46.0" \
            httpx \
            pandas \
            numpy
          pip install curl_cffi yfinance --no-deps || pip install curl_cffi yfinance
          pip install pytest pytest-anyio anyio

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: .pytest_cache/
          retention-days: 7

  # ── בדיקות הפרונטאנד. הלוגיקה שהמשתמש רואה בפועל — זיהוי אזורים, מיזוג
  # בין רזולוציות, התקדים ההיסטורי, ספי RSI — חיה ב-index.html שבענף
  # gh-pages. המשימה מושכת את שני הענפים כדי שאפשר יהיה גם להשוות ביניהם:
  # הבדיקה החשובה ביותר כאן מוודאת שספי ה-RSI בדפדפן ובשרת לא נפרדים. ──
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout backend and tests (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout frontend (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run frontend tests
        run: node tests/frontend/run.js
