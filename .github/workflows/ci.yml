name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi==0.141.1 \
            "uvicorn[standard]==0.46.0" \
            httpx \
            pandas \
            numpy
          pip install curl_cffi yfinance --no-deps || pip install curl_cffi yfinance
          pip install pytest pytest-anyio anyio

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: .pytest_cache/
          retention-days: 7
